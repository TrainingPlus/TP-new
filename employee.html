<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Portal - Student Directory</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS for Exporting to Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <div class="sidebar">
        <h2>TP Portal</h2>
        <a href="employee.html" class="active">Student Directory</a>
        <a href="index.html">Logout</a>
    </div>

    <div class="content">
        <h1>Student Directory Management</h1>

        <!-- Add Student Form -->
        <div class="glass-card">
            <h3>Add New Student Record</h3>
            <form id="addStudentForm" onsubmit="handleFormSubmit(event)">
                <div class="form-grid">
                    <input type="text" id="cpr" placeholder="CPR Number (9 digits)" required maxlength="9" pattern="\d{9}">
                    <input type="text" id="name_en" placeholder="Full Name (English)" required>
                    <input type="text" id="name_ar" placeholder="الاسم الكامل (عربي)" required>
                    <input type="email" id="email" placeholder="Email Address" required>
                    <input type="text" id="phone" placeholder="Phone Number" required>
                    <input type="text" id="course" placeholder="Course Name" required>
                </div>
                <button type="submit">Save Student Record</button>
            </form>
        </div>

        <!-- Student List -->
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Registered Students</h3>
                <button onclick="exportToExcel()" style="background: #10b981;">Export to Excel</button>
            </div>
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>CPR</th>
                        <th>Name (EN)</th>
                        <th>Name (AR)</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList">
                    <!-- Dynamic Loading -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
